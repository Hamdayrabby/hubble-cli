name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # so publish.yml can re-run this same matrix against a tagged commit

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install bubblewrap (native sandbox tests)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y bubblewrap || true
      - run: pip install -e ".[dev]"
      - name: Report native sandbox availability
        run: python -c "from hubble.sandbox import native_kind; print('::notice::native sandbox on ${{ matrix.os }}:', native_kind())"
      - run: pytest -q -rs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - run: pip install dist/*.whl
      - run: hubble --version

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # so publish.yml can re-run this same matrix against a tagged commit

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install bubblewrap (native sandbox tests)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y bubblewrap || true
      - run: pip install -e ".[dev]"
      - name: Report native sandbox availability
        run: python -c "from hubble.sandbox import native_kind; print('::notice::native sandbox on ${{ matrix.os }}:', native_kind())"
      - run: pytest -q -rs --junitxml=junit.xml
      - name: Name failing tests in the run summary
        if: failure()
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse("junit.xml").getroot()
          except (OSError, ET.ParseError):
              raise SystemExit(0)
          for case in root.iter("testcase"):
              for bad in list(case.findall("failure")) + list(case.findall("error")):
                  msg = (bad.get("message") or "").replace("\n", " ")[:300]
                  name = f"{case.get('classname')}::{case.get('name')}"
                  print(f"::error title={name}::{msg}")

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - run: pip install dist/*.whl
      - run: hubble --version
